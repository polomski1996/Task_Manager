<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Stack+Sans+Headline:wght@200..700&family=VT323&display=swap');
    </style>
</head>
<body>
    <div class="container">
        <!-- <h1>To-Do List</h1> -->

        <div class="button-group">
            <button class="filter-button" data-filter="today">Today's Tasks</button>
            <button class="filter-button" data-filter="all">All Tasks</button>
            <button class="filter-button" data-filter="parent">Parent Tasks</button>
            <button class="add-task">Add Task</button>
        </div>

        <table id="todo-table">
            <thead id="todo-head">
                <tr>
                    <th>Done</th>
                    <th>Task Name</th>
                    <th>Parent Task</th>
                    <th>Acceptance Criteria</th>
                    <th>Start Hour</th>
                    <th>Estimated Time</th>
                    <th>Date</th> <!-- New column -->
                </tr>
            </thead>
            <tbody>
                <!-- database rows -->
            </tbody>
        </table>
    </div>
    <br/>


    <!-- adding task form-->
    <div class="task-form-container hidden" style="margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 5px;">
        <h3>Dodaj nowe zadanie</h3>
        <form id="task-form">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
                <div>
                    <label>Nazwa zadania:</label>
                    <input type="text" id="task-name" required style="width: 100%; padding: 5px;">
                </div>
                <div>
                    <label>Zadanie nadrzędne:</label>
                    <select id="parent-task" style="width: 100%; padding: 5px;">
                        <option value="">Brak (zadanie główne)</option>
                    </select>
                </div>
                <div>
                    <label>Kryteria akceptacji:</label>
                    <textarea id="acceptance-criteria" style="width: 100%; padding: 5px; height: 60px;"></textarea>
                </div>
                <div>
                    <label>Godzina rozpoczęcia:</label>
                    <input type="time" id="start-hour" style="width: 100%; padding: 5px;">
                </div>
                <div>
                    <label>Szacowany czas:</label>
                    <input type="text" id="estimated-time" placeholder="np. 1 hour, 30 minutes" style="width: 100%; padding: 5px;">
                </div>
                <div>
                    <label>Data:</label>
                    <input type="date" id="task-date" required style="width: 100%; padding: 5px;">
                </div>
            </div>
            <button type="submit" style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer;">
                Dodaj zadanie
            </button>
            <button class="finish-add-button" style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer;">
                Finish adding
            </button>
        </form>
    </div>


    <script src="api.js"></script>
</body>
</html>
