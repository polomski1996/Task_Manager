<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles/main.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Oswald:wght@200..700&family=Stack+Sans+Headline:wght@200..700&family=VT323&display=swap');
    </style>
</head>
<body>
    <div class="container">
        <div class="Control-Panel">
            <!-- WEEKLY TARGETS -->
            <div class="panel-section">
                <div class="panel-header">
                    <h3>WEEK TARGETS</h3>
                </div>
                <div class="panel-content">
                    <table class="panel-table">
                        <thead>
                            <tr>
                                <th>Target Name</th>
                                <th>Deadline</th>
                            </tr>
                        </thead>
                        <tbody class="targets-content">
                            <!-- here week targets will be rendered -->
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- PARENT TASKS -->
            <div class="panel-section">
                <div class="panel-header">
                    <h3>PARENT TASKS</h3>
                </div>
                <div class="panel-content">
                    <table class="panel-table">
                        <thead>
                            <tr>
                                <th>Task Name</th>
                            </tr>
                        </thead>
                        <tbody class="parent-tasks">
                            <!-- here parent tasks will be rendered -->
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- BUTTON GROUP -->
            <div class="panel-section button-group-section">
                <div class="button-group">
                    <button class="filter-button" data-filter="today">Today's Tasks</button>
                    <button class="filter-button" data-filter="all">All Tasks</button>
                    <button class="add-task">Add Task</button>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table id="todo-table">
                <thead id="todo-head">
                    <tr>
                        <th>Done</th>
                        <th>Task Name</th>
                        <th>Parent Task</th>
                        <th>Acceptance Criteria</th>
                        <th>Start Hour</th>
                        <th>Estimated Time</th>
                        <th>Date</th>
                        <th class="action-column">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- database rows -->
                </tbody>
            </table>
        </div>
    </div>
    <br/>

    <!-- adding task form-->
    <div class="task-form-container hidden">
        <!-- ADD TASK FORM -->
        <form id="task-form">
            <h3>Add Task</h3>
            <div id="inputs">
                <div>
                    <label>Task Name:</label>
                    <input type="text" id="task-name">
                </div>
                <div>
                    <label>Parent Task:</label>
                    <select id="parent-task-drop">
                        <option value="">Parent</option>
                    </select>
                </div>
                <div>
                    <label>Acceptance Criteria:</label>
                    <textarea id="acceptance-criteria"></textarea>
                </div>
                <div>
                    <label>Start Hour:</label>
                    <input type="time" id="start-hour" required>
                </div>
                <div>
                    <label>Estimated Time:</label>
                    <input type="text" id="estimated-time" placeholder="np. 1 hour, 30 minutes">
                </div>
                <div>
                    <label>Date:</label>
                    <input type="date" id="task-date" required>
                </div>
            </div>
            <button type="submit">
                Add Task
            </button>
        </form>
        <br>
        <!-- ADD WEEK TARGET FORM -->
        <form id="target-form">
            <h3>Add Week Target</h3>
            <div id="inputs">
                <div>
                    <label>Target Name:</label>
                    <input type="text" id="target-name">
                </div>
                <div>
                    <label>Parent Task:</label>
                    <select id="parent-target-drop">
                        <option value="">Brak</option>
                    </select>
                </div>
                <div>
                    <label>Description:</label>
                    <textarea id="description"></textarea>
                </div>
                <div>
                    <label>Deadline:</label>
                    <input type="date" id="deadline-date">
                </div>
            </div>
            <button type="submit">
                Add Target
            </button>
            <button type="button" class="finish-add-button">
                Quit
            </button>
        </form>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
