<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Oswald:wght@200..700&family=Stack+Sans+Headline:wght@200..700&family=VT323&display=swap');
    </style>
</head>
<body>
    <div class="container">
        <!-- WEEKLY TARGETS -->
        <div class="week-targets">

        </div>

        <!-- BUTTON GROUP -->
        <div class="button-group">
            <button class="filter-button" data-filter="today">Today's Tasks</button>
            <button class="filter-button" data-filter="all">All Tasks</button>
            <button class="filter-button" data-filter="parent">Parent Tasks</button>
            <button class="add-task">Add Task</button>
        </div>

        <table id="todo-table">
            <thead id="todo-head">
                <tr>
                    <th>Done</th>
                    <th>Task Name</th>
                    <th>Parent Task</th>
                    <th>Acceptance Criteria</th>
                    <th>Start Hour</th>
                    <th>Estimated Time</th>
                    <th>Date</th> <!-- New column -->
                </tr>
            </thead>
            <tbody>
                <!-- database rows -->
            </tbody>
        </table>
    </div>
    <br/>


    <!-- adding task form-->
    <div class="task-form-container hidden" >
        <h3>Add Task</h3>
        <form id="task-form">
            <div id="inputs" >
                <div>
                    <label>Task Name:</label>
                    <input type="text" id="task-name" >
                </div>
                <div>
                    <label>Parent Task:</label>
                    <select id="parent-task">
                        <option value="">Brak (zadanie główne)</option>
                    </select>
                </div>
                <div>
                    <label>Acceptance Criteria:</label>
                    <textarea id="acceptance-criteria"></textarea>
                </div>
                <div>
                    <label>Start Hour:</label>
                    <input type="time" id="start-hour">
                </div>
                <div>
                    <label>Estimated Time:</label>
                    <input type="text" id="estimated-time" placeholder="np. 1 hour, 30 minutes">
                </div>
                <div>
                    <label>Date:</label>
                    <input type="date" id="task-date" required >
                </div>
            </div>
            <button type="submit" >
                Add to Schedule
            </button>
            <button class="finish-add-button" >
                Finish adding
            </button>
        </form>
    </div>


    <script src="api.js"></script>
</body>
</html>
